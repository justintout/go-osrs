name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: make check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # golangci-lint v2.13 cannot read Go 1.27.2's export data, so lint
      # on the module's minimum Go. Tests still cover 1.27.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
